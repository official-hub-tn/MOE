<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try{
const canvas=document.getElementById('bg');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.1,200);camera.position.z=10;
// 3D stars
const N=1800,pos=new Float32Array(N*3),size=new Float32Array(N);
for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*90;pos[i*3+1]=(Math.random()-.5)*60;pos[i*3+2]=-60+Math.random()*68;size[i]=.6+Math.random()*1.6}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
const moonPos=new THREE.Vector3(3,2,2);
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uMoon:{value:moonPos},uPR:{value:renderer.getPixelRatio()}},
 vertexShader:'attribute float aSize;uniform vec3 uMoon;uniform float uPR;varying float vB;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);float d=distance(position,uMoon);vB=1.+4.*exp(-d*d*.02);gl_PointSize=aSize*uPR*min(vB,3.)*(40./-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying float vB;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);gl_FragColor=vec4(vec3(.82,.88,1.)*min(vB,2.),a*min(.35*vB,1.));}'});
scene.add(new THREE.Points(g,mat));
// small moon (3D sphere, lit from one side)
const moon=new THREE.Mesh(new THREE.SphereGeometry(.2,40,40),new THREE.MeshLambertMaterial({color:0xfff4d6,emissive:0x2a2418}));
scene.add(moon);
const sun=new THREE.DirectionalLight(0xffffff,1.25);sun.position.set(-5,3,4);scene.add(sun);
scene.add(new THREE.AmbientLight(0x1a2038,.8));
// soft glow around the moon
const cv=document.createElement('canvas');cv.width=cv.height=128;
const cx=cv.getContext('2d'),gr=cx.createRadialGradient(64,64,0,64,64,64);
gr.addColorStop(0,'rgba(255,240,200,.9)');gr.addColorStop(.25,'rgba(255,230,170,.35)');gr.addColorStop(1,'rgba(255,230,170,0)');
cx.fillStyle=gr;cx.fillRect(0,0,128,128);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
glow.scale.set(2.6,2.6,1);moon.add(glow);
// pointer -> moon
let px=0,py=0,active=false,ndcX=.5,ndcY=-.4;
function move(e){active=true;ndcX=(e.clientX/innerWidth)*2-1;ndcY=-(e.clientY/innerHeight)*2+1;px=ndcX;py=ndcY}
addEventListener('pointermove',move);addEventListener('pointerdown',move);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const tgt=new THREE.Vector3(),dir=new THREE.Vector3();let t=0;
(function loop(){
 requestAnimationFrame(loop);t+=.01;
 if(!active){ndcX=.55+Math.sin(t*.7)*.1;ndcY=.55+Math.cos(t*.5)*.08}
 dir.set(ndcX,ndcY,.5).unproject(camera).sub(camera.position).normalize();
 tgt.copy(camera.position).addScaledVector(dir,(camera.position.z-2)/-dir.z);
 moonPos.lerp(tgt,.12);moon.position.copy(moonPos);moon.rotation.y+=.004;
 const p=g.attributes.position.array;
 for(let i=0;i<N;i++){p[i*3+2]+=.03;if(p[i*3+2]>9)p[i*3+2]=-60}
 g.attributes.position.needsUpdate=true;
 camera.position.x+=(px*1.2-camera.position.x)*.04;camera.position.y+=(py*.8-camera.position.y)*.04;
 camera.lookAt(0,0,0);
 renderer.render(scene,camera);
})();
}catch(e){console.error(e)}
</script>
